version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: novalibros-backend
    ports:
      # Expone el puerto del servidor. La regla es "HOST_PORT:CONTAINER_PORT"
      - "${PORT:-3012}:${PORT:-3012}"
    env_file:
      # Injecta automáticamente todas las variables del `.env` local
      - .env
    volumes:
      # Sincroniza el código fuente local con el contenedor para el HOT-RELOAD
      - .:/usr/src/app
      
      # Excepciones: Creamos volúmenes anónimos para no sobreescribir dependencias.
      # Estos directorios vivirán solo dentro del contenedor de Linux y no chocarán 
      # con tu computadora Windows/Mac/Ubuntu.
      - /usr/src/app/node_modules
    
    # Sobrescribimos el 'start:prod' del Dockerfile por 'start:dev' para desarrollo local.
    # El pre-script de npx asegurará que los Modelos de prisma existan en el volúmen antes de lanzar Nest.
    command: sh -c "npm install && npx prisma generate && npm run start:dev"
    restart: unless-stopped
